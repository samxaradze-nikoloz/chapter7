{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Newspaper{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid d-flex justify-content-between align-items-center">
            <a class="navbar-brand text-warning" href="{% url 'home' %}">Newspaper</a>
            <div>
                {% if user.is_authenticated %}
                    <span class="text-light me-2">Hello, {{ user.username }}</span>
                    <form method="post" action="{% url 'logout' %}" style="display: inline;">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-link text-light p-0 align-baseline" style="border: none; background: none;">
                            Log out
                        </button>
                    </form>
                {% else %}
                    <a class="nav-link d-inline text-light" href="{% url 'login' %}">Log In</a>
                    <a class="nav-link d-inline text-light" href="{% url 'signup' %}">Sign Up</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
